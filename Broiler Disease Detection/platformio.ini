; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.partitions = huge_app.csv
; lib_ldf_mode = deep+
lib_deps = 
    LiquidCrystal_I2C@1.1.2
	adafruit/DHT sensor library@^1.4.4
	adafruit/Adafruit Unified Sensor@^1.1.4
	arduino-libraries/Servo@^1.1.8
	arduino-libraries/ArduinoHttpClient@^0.6.0
	ArduinoJson
	ESP32Servo
	bblanchon/ArduinoJson@^7.0.0
	tinygsm
	https://github.com/me-no-dev/ESPAsyncWebServer.git
    https://github.com/me-no-dev/AsyncTCP.git
	

	
	
	
	
  
build_flags =
	-DBOARD_HAS_PSRAM 
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=5
    -O3
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
	-Os
	-std=gnu++17
	-D TINY_GSM_MODEM_SIM800
	-DTF_LITE_STATIC_MEMORY
	-I"lib/tensorflow/lite"        
	-I"lib/tensorflow/lite/micro"
	-I"lib/tensorflow/lite/kernels/internal"
	-I"lib/tensorflow/lite/c"
	-I"lib/tflite/third_party/flatbuffers"
	-Ilib/flatbuffers/include

    -D MODEL_PATH=\"data/broiler_disease_audio_esp32.tflite\"

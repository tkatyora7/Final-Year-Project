{% include 'styles.html'%}
{% load static%}
<!DOCTYPE html>
<html lang="en">
    <body>
    <div class="min-h-screen flex items-center justify-center bg-gray-100">
        <div class="w-full max-w-md p-8 bg-white rounded-lg shadow-lg">
            {% for message in messages %}
                {% if message.tags == 'error' %}
                <div class="flex items-center p-4 mb-4 rounded-lg border bg-red-500 border-red-500">
                    <div class="flex-shrink-0">
                        <svg class="w-4 h-4 text-white" viewBox="0 0 20 20" 
                        fill="currentColor">
                            <path fill-rule="evenodd"
                             d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="font-medium text-white">{{ message }}</p>
                    </div>
                    
                </div>
                {% endif %}
        
                {% if message.tags == 'success' %}
                <div class="flex items-center p-4 mb-4 rounded-lg border bg-green-50 border-green-200">
                    <div class="flex-shrink-0"> 
                        <svg class="w-4 h-4 text-green-600" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.857-9.809a.75.75 0 00-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 10-1.06 1.061l2.5 2.5a.75.75 0 001.137-.089l4-5.5z" clip-rule="evenodd" />
                        </svg>
                    </div>
                    <div class="ml-3">
                        <p class="font-medium text-green-700">{{ message }}</p>
                    </div>
                </div>
                {% endif %}
            {% endfor %}
     
            <div class="text-center mb-8">
            <img src="{% static 'imagies/images.jpg'%}" alt="Broiler" class="mx-auto mb-4 rounded-lg"/>
                <h1 class="text-2xl font-bold text-gray-900">Broiler Disease Detection</h1>
                <p class="text-gray-600 mt-2">Sign in to your dashboard</p>
            </div>
            
            <form method="POST" action="{% url 'login' %}" class="space-y-6">
                {% csrf_token %}
                <div>
                    <label class="block text-sm font-medium text-gray-700">Username</label>
                    <input 
                        type="text" 
                        name="username"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        required
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700">Password</label>
                    <input 
                        type="password" 
                        name="password"
                        class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                        required
                    >
                </div>
                
                <button 
                    type="submit"
                    class="w-full py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500"
                >
                    Sign In
                </button>
            </form>
        </div>
    </div>
    
    </body> 
</html>
